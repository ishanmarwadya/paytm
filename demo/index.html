<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vyapaar Pay – Field demo</title>
<meta name="description" content="Guided demo for shop owners: feature tour, set up your own shop, record reactions. Velocity Squad, IIM Bangalore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002E6E; --cyan:#00BAF2; --action:#0067B8; --action-ink:#fff;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF1F9; --surface-3:#DCE7F4;
  --text:#0E1B2E; --muted:#51627A; --border:#D6E0EC;
  --in:#0B7A43; --in-bg:#E3F5EB; --out:#B4321F; --out-bg:#FCE9E6; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --hero:#002E6E; --hero-muted:#B9CDEA; --shadow:0 1px 2px rgba(0,30,70,.06),0 4px 14px rgba(0,30,70,.06);
  --font:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#8FB4FF; --action:#3BC4F5; --action-ink:#04172F; --bg:#0A1424; --surface:#111E33; --surface-2:#1A2A44; --surface-3:#22365A;
  --text:#E8EEF7; --muted:#9AAAC2; --border:#263A5A; --in:#4ADE95; --in-bg:#0F2E22; --out:#FF8A7A; --out-bg:#3A1A17; --warn:#FFC966; --warn-bg:#3A2C0A;
  --hero:#0F2A57; --hero-muted:#A9BEDD; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --navy:#8FB4FF; --action:#3BC4F5; --action-ink:#04172F; --bg:#0A1424; --surface:#111E33; --surface-2:#1A2A44; --surface-3:#22365A;
  --text:#E8EEF7; --muted:#9AAAC2; --border:#263A5A; --in:#4ADE95; --in-bg:#0F2E22; --out:#FF8A7A; --out-bg:#3A1A17; --warn:#FFC966; --warn-bg:#3A2C0A;
  --hero:#0F2A57; --hero-muted:#A9BEDD; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
svg.i{width:1.15em;height:1.15em;flex:none}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:inline}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:inline}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:15px} .tiny{font-size:13.5px}

/* frame */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.top img{height:20px}
.top .ttl{font-weight:800;color:var(--navy);font-size:16px;white-space:nowrap}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.ib svg{width:20px;height:20px}
.timer{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 10px}
.steps div{font-size:12.5px;font-weight:700;color:var(--muted)}
.steps i{display:block;height:5px;border-radius:9px;background:var(--surface-3);margin-bottom:4px;overflow:hidden}
.steps i b{display:block;height:100%;background:var(--action);border-radius:9px}
.steps .on{color:var(--action)}
main{max-width:620px;margin:0 auto;padding:18px 16px 120px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:20}
.foot-in{max-width:620px;margin:0 auto;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}

/* type & blocks */
h1{font-size:28px;line-height:1.15;margin:4px 0 8px}
h2{font-size:22px;line-height:1.2;margin:0 0 6px}
h3{font-size:17px;margin:0 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:17px;background:var(--action);color:var(--action-ink);text-decoration:none}
.btn svg{width:19px;height:19px}
.btn.sec{background:var(--surface-2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--action);padding:0 8px}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin:0 0 14px}
.field label,.qlabel{display:block;font-weight:700;font-size:15.5px;margin:0 0 6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);padding:12px 14px;min-height:50px;font-size:17px}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--action);outline:0}
.hint{font-size:13.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:15.5px;border:1.5px solid transparent;min-height:42px}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--action);color:var(--action)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface-2);text-align:left;width:100%}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px}
.check[aria-checked="true"] .box{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.box svg{width:16px;height:16px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px}
.note svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--action)}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.warn svg{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.p-in{background:var(--in-bg);color:var(--in)} .p-out{background:var(--out-bg);color:var(--out)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-info{background:var(--surface-2);color:var(--navy)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list .li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .body b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .body small{display:block;color:var(--muted);font-size:14px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--surface-2);color:var(--navy)}
.amt-in{color:var(--in)} .amt-out{color:var(--out)}

/* home */
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(0,186,242,.18)}
.hero p{color:var(--hero-muted);margin:6px 0 0}
.menu{display:grid;gap:10px}
.mi{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;text-decoration:none;color:var(--text)}
.mi .mic{width:44px;height:44px;border-radius:13px;background:var(--surface-2);color:var(--action);display:grid;place-items:center;flex:none}
.mi .mic svg{width:22px;height:22px}
.mi b{display:block} .mi small{color:var(--muted);font-size:14.5px}
.mi>div{flex:1}

/* tour */
.kicker{font-size:14px;font-weight:800;color:var(--action);letter-spacing:.2px}
.hinglish{font-size:19px;font-weight:700;margin:2px 0 8px;color:var(--text)}
.mock{background:var(--surface-2);border-radius:20px;padding:16px;margin:4px 0 16px}
.mcard{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:5px 0}
.mrow span:first-child{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;font-size:13.5px;font-weight:700}
.tile .av{margin:0 auto 6px;width:38px;height:38px;font-size:13px}
.tile span{display:block;color:var(--muted);font-weight:600}
.bubble{padding:9px 13px;border-radius:16px;font-size:15px;max-width:85%;margin:6px 0}
.b-them{background:var(--surface);border-bottom-left-radius:4px}
.b-me{background:var(--action);color:var(--action-ink);margin-left:auto;border-bottom-right-radius:4px}
.wa{background:#E7F7EC;color:#10301C;border-radius:14px;padding:12px}
:root[data-theme="dark"] .wa{background:#103222;color:#DDF5E5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#103222;color:#DDF5E5}}
.bar{height:12px;border-radius:9px;background:var(--surface-3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.sbx{display:flex;gap:10px;align-items:center}
.sbx .spk{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .sbx .spk{background:#0F2A57}
.sbx .spk svg{width:22px;height:22px}
.react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--surface);border:2px solid var(--border);font-weight:700;font-size:15px;min-height:76px;justify-content:center}
.rb .e{font-size:24px;line-height:1}
.rb[aria-pressed="true"]{border-color:var(--action);background:var(--surface-2);color:var(--action)}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--action);width:20px;border-radius:9px}
.dots i.done{background:var(--cyan)}

/* app preview */
.app{border:1.5px solid var(--border);border-radius:24px;overflow:hidden;background:var(--bg)}
.app-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.app-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.owe{background:var(--hero);color:#fff;border-radius:18px;padding:16px}
.owe .v{font-size:30px;font-weight:800;line-height:1.1}
.owe small{color:var(--hero-muted)}
.todo{display:grid;gap:6px}
.todo div{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:600}
.todo .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.todo .done .tick{background:var(--in);border-color:var(--in);color:#fff}
.todo .tick svg{width:14px;height:14px}
.todo .done{color:var(--in)}
.duecard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,16,36,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--border);margin:-4px auto 12px}
.big{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.spin{width:52px;height:52px;border-radius:50%;border:5px solid var(--surface-2);border-top-color:var(--action);animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{width:76px;height:76px;border-radius:50%;background:var(--in-bg);color:var(--in);display:grid;place-items:center;margin:10px auto}
.ok svg{width:40px;height:40px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0E1B2E;color:#fff;padding:12px 16px;border-radius:14px;z-index:60;font-size:15px;max-width:min(92vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
:root[data-theme="dark"] .toast{background:#E8EEF7;color:#0E1B2E}

/* feedback */
.q{padding:16px 0;border-bottom:1px solid var(--border)}
.q:last-child{border-bottom:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:56px;border-radius:12px;background:var(--surface-2);font-weight:800;font-size:18px;border:2px solid transparent}
.scale button[aria-pressed="true"]{border-color:var(--action);color:var(--action);background:var(--surface)}
.scale-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.iv{border-left:5px solid var(--warn)}
.task{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;color:var(--muted);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:10px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.scrollx{overflow-x:auto}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.sum span:nth-child(odd){color:var(--muted)}
.guide ol{padding-left:20px;margin:0} .guide li{margin:0 0 10px}
.say{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-style:italic;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>

/* ---------- maths for udhaar ---------- */
function dueAt(d){ return d.givenAt+(d.freeDays+d.ext)*DAY; }
function lateDays(d){ return Math.max(0,Math.floor((today0-dueAt(d))/DAY)); }
function outstanding(d){ return Math.max(0,d.amount-d.paid); }
function interest(d){ const ld=lateDays(d); if(!ld||!d.rate) return 0; return Math.max(0,Math.round(outstanding(d)*d.rate/100*ld/30)-d.intPaid); }
function owed(d){ return outstanding(d)+interest(d); }
const supName=id=>{ const s=X.sups.find(x=>x.id===id); return s?s.name:'Supplier'; };

function toast(m){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function go(s,extra){ S.screen=s; Object.assign(S,extra||{}); window.scrollTo(0,0); render(); }
function download(name,text,type){ try{ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); toast('Downloaded '+name); }catch(e){ toast('Download not allowed here – open the demo in a normal browser tab'); } }
function csvRows(list){

    ...F.flatMap(f=>['react_'+f.id,'note_'+f.id]),'shop_name','shop_type','suppliers_count','suppliers','dues_count','dues_total',

  const q=v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=list.map(s=>{ const fb=s.fb||{}; const has=k=>(s.log||[]).some(l=>l.t===k)?'yes':'no';
    return [s.id,s.status,new Date(s.started).toISOString(),s.ended?new Date(s.ended).toISOString():'',Math.round(((s.ended||Date.now())-s.started)/60000),s.interviewer,s.area,s.vendor,s.vtype,s.consent?'yes':'no',s.recording?'yes':'no',
      ...F.flatMap(f=>[(s.react[f.id]||{}).r||'',(s.react[f.id]||{}).note||'']),s.shop.name,s.shop.type,s.sups.length,
      s.sups.map(x=>`${x.name} (${x.what||'-'}; ${x.via||'-'}; ${x.credit?x.credit+'d credit':'no credit'})`).join(' | '),s.dues.length,s.dues.reduce((a,d)=>a+d.amount,0),
      has('pay'),has('ext'),has('view'),...TASKS.map(t=>(s.tasks||{})[t[0]]||''),...Q.map(qq=>Array.isArray(fb[qq.id])?fb[qq.id].join('; '):(fb[qq.id]||'')),fb.barrierOther||'',s.notes||''].map(q).join(','); });
  return [head.join(','),...rows].join('\n');
}
function sampleSup(){ const t=X.shop.type||'Kirana'; const ex={'Kirana':['Nandini Milk Agency','Milk & dairy',0],'Medical store':['Lifeline Pharma Distributors','Pharma distributor',21],'Hardware':['Jain Pipes & Fittings','Pipes & fittings',30],'Restaurant / food':['Sri Balaji Provisions','Groceries',7],'Salon':['Glamour Cosmetics','Salon products',15],'Wholesaler':['Deccan Foods','Brand / company',15],'Other':['City Traders','Stock',15]}[t]||['City Traders','Stock',15];

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, v=el.dataset.v;
  switch(a){
    case 'theme': { const dark=document.documentElement.getAttribute('data-theme')==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches); S.theme=dark?'light':'dark'; pref('theme',S.theme); render(); break; }
    case 'go': go(el.dataset.s); break;
    case 'start': X=newSession(); persist(); go('setup',{fi:0}); break;
    case 'resume': case 'open': { X=loadAll().find(s=>s.id===el.dataset.id); if(!X) return; if(X.status==='complete') go('done'); else go(X.shop.type?'tryApp':'setup'); if(X.status!=='complete'&&!X.dues.length) go(X.consent?'tour':'setup',{fi:0}); break; }
    case 'exit': persist(); X=null; S.sheet=null; go('home'); toast('Session saved – you can continue it later'); break;
    case 'vtype': X.vtype=v; if(!X.shop.type) X.shop.type=v; persist(); render(); break;
    case 'flip': X[el.dataset.k]=!X[el.dataset.k]; persist(); render(); break;
    case 'to': { const s=el.dataset.s; if(s==='tour'&&el.dataset.fi) S.fi=+el.dataset.fi; else if(s==='tour'&&S.screen==='setup'){ S.fi=0; logE('tour_start'); } go(s); if(s==='tryApp') logE('app_view'); break; }
    case 'react': { const f=F[S.fi]; X.react[f.id]=Object.assign(X.react[f.id]||{},{r:v}); persist(); render(); break; }
    case 'tour-back': if(S.fi>0){ S.fi--; window.scrollTo(0,0); render(); } else go('setup'); break;
    case 'tour-next': if(S.fi<F.length-1){ S.fi++; window.scrollTo(0,0); render(); } else go('tryIntro'); break;
    case 'stype': X.shop.type=v; persist(); render(); break;
    case 'supadd': S.supForm={name:'',what:'',via:'',credit:15}; S._focus='sfn'; render(); break;
    case 'sf': S.supForm[el.dataset.k]=el.dataset.k==='credit'?+v:v; render(); break;
    case 'supcancel': S.supForm=null; render(); break;
    case 'supsave': { const f=S.supForm; if(!f.name.trim()) return; X.sups.push({id:uid(),name:f.name.trim(),what:f.what,via:f.via,credit:f.credit}); S.supForm=null; logE('sup_add',f.name); render(); toast('Supplier saved'); break; }
    case 'sample': X.sups.push(sampleSup()); logE('sup_sample'); render(); break;
    case 'delsup': X.sups=X.sups.filter(s=>s.id!==el.dataset.id); X.dues=X.dues.filter(d=>d.sid!==el.dataset.id); persist(); render(); break;
    case 'dueadd': { const s0=X.sups[0]; S.dueForm={sid:s0.id,amount:'',ago:7,free:s0.credit||15,rate:1.5}; S._focus='dfa'; render(); break; }
    case 'df': { const k=el.dataset.k; S.dueForm[k]=k==='sid'?v:+v; if(k==='sid'){ const s=X.sups.find(x=>x.id===v); if(s&&s.credit) S.dueForm.free=s.credit; } render(); break; }
    case 'duecancel': S.dueForm=null; render(); break;
    case 'duesave': { const f=S.dueForm; const amt=+String(f.amount).replace(/\D/g,''); if(!(amt>0)) return; X.dues.push({id:uid(),sid:f.sid,amount:amt,givenAt:today0-f.ago*DAY,freeDays:f.free,rate:f.rate,ext:0,paid:0,intPaid:0}); S.dueForm=null; logE('due_add',amt); render(); toast('Udhaar saved'); break; }
    case 'sampledue': { const s=X.sups[0]; X.dues.push({id:uid(),sid:s.id,amount:24500,givenAt:today0-12*DAY,freeDays:10,rate:1.5,ext:0,paid:0,intPaid:0,sample:true}); logE('due_sample'); render(); break; }
    case 'deldue': X.dues=X.dues.filter(d=>d.id!==el.dataset.id); persist(); render(); break;
    case 'pay': S.sheet={k:'pay',id:el.dataset.id,step:'amt',amt:0}; S._focus='pa'; render(); break;
    case 'pamt': S.sheet.amt=+v; render(); break;
    case 'pgo': { const s=S.sheet; const d=X.dues.find(x=>x.id===s.id); const amt=Math.min(s.amt,owed(d)); if(!(amt>0)) return; s.amt=amt; s.step='wait'; render();
      setTimeout(()=>{ const it=interest(d); const toInt=Math.min(it,amt); d.intPaid+=toInt; d.paid+=Math.min(outstanding(d),amt-toInt); logE('pay',amt); s.step='ok'; render(); },1200); break; }
    case 'ext': S.sheet={k:'ext',id:el.dataset.id,step:'ask',days:7,why:''}; render(); break;
    case 'exd': S.sheet.days=+v; render(); break;
    case 'exr': S.sheet.why=S.sheet.why===v?'':v; render(); break;
    case 'exgo': { const s=S.sheet; s.step='wait'; render(); setTimeout(()=>{ const d=X.dues.find(x=>x.id===s.id); d.ext+=s.days; logE('ext',s.days); s.step='ok'; render(); },1500); break; }
    case 'view': S.sheet={k:'view',id:el.dataset.id}; logE('view'); render(); break;
    case 'svrem': toast('Reminder sent – it would reach the shop’s app and Soundbox'); logE('sv_reminder'); break;
    case 'close': S.sheet=null; render(); break;
    case 'fb1': X.fb[el.dataset.q]=X.fb[el.dataset.q]===v?'':v; persist(); render(); break;
    case 'fbm': { const k=el.dataset.q, arr=X.fb[k]||[]; if(v==='Nothing') X.fb[k]=arr.includes('Nothing')?[]:['Nothing']; else { const a2=arr.filter(x=>x!=='Nothing'); X.fb[k]=a2.includes(v)?a2.filter(x=>x!==v):[...a2,v]; } persist(); render(); break; }
    case 'task': X.tasks[el.dataset.k]=X.tasks[el.dataset.k]===v?'':v; persist(); render(); break;
    case 'finish': { TASKS.forEach(([k])=>{ if(!X.tasks[k]){ const auto=k==='sup'?X.sups.length>0:k==='due'?X.dues.length>0:did(k); if(!auto) X.tasks[k]='Skipped'; } }); X.ended=Date.now(); X.status='complete'; persist(); go('done'); break; }
    case 'csv-one': download(`vyapaar-demo-${X.id}.csv`,csvRows([X]),'text/csv'); break;
    case 'csv-all': download(`vyapaar-demo-all-${new Date().toISOString().slice(0,10)}.csv`,csvRows(loadAll()),'text/csv'); break;
    case 'json-all': download(`vyapaar-demo-all-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(loadAll(),null,2),'application/json'); break;
    case 'wipe': if(confirm('Delete all saved sessions on this device? Download them first.')){ saveAll([]); render(); toast('All sessions deleted'); } break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(d.f){ X[d.f]=t.value; if(d.f==='interviewer'||d.f==='area') pref(d.f,t.value); persist(); }
  if(d.reactNote){ X.react[d.reactNote]=Object.assign(X.react[d.reactNote]||{},{note:t.value}); persist(); }
  if(d.shop){ X.shop[d.shop]=t.value; persist(); const b=document.getElementById('nx'); if(b) b.disabled=!(X.shop.name.trim()&&X.shop.type); }
  if(d.sf){ S.supForm[d.sf]=t.value; const b=document.getElementById('sfsave'); if(b) b.disabled=!t.value.trim(); }
  if(d.df){ const n=+t.value.replace(/\D/g,''); t.value=n||''; S.dueForm.amount=n; const b=document.getElementById('dfsave'); if(b) b.disabled=!(n>0&&S.dueForm.sid);
    const p=document.getElementById('dprev'); const f=S.dueForm; if(p) p.querySelector('span').innerHTML=n?duePreview({givenAt:today0-f.ago*DAY,freeDays:f.free,ext:0,amount:n,paid:0,intPaid:0,rate:f.rate}):'Enter an amount to see the due date.'; }
  if(d.pay){ const n=+t.value.replace(/\D/g,''); t.value=n||''; S.sheet.amt=n; const b=document.getElementById('pgo'); const dd=X.dues.find(x=>x.id===S.sheet.id); if(b){ b.disabled=!(n>0); b.innerHTML=ic('shield')+'Pay '+(n>0?inr(Math.min(n,owed(dd))):''); } }
  if(d.fbt){ X.fb[d.fbt]=t.value; persist(); }
  if(d.notes){ X.notes=t.value; persist(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.sheet){ S.sheet=null; render(); } });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(S.theme==='system') render(); });
render();
</script>
</body>
</html>
