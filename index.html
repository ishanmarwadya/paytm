<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paytm Vyapaar Pay – supplier payments and khata</title>
<meta name="description" content="Vyapaar Pay prototype – Paytm Innovation Challenge 2026, Track B (Velocity Squad, IIM Bangalore)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002E6E; --cyan:#00BAF2; --action:#0067B8; --action-ink:#fff;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF1F9; --surface-3:#DCE7F4;
  --text:#0E1B2E; --muted:#51627A; --border:#D6E0EC;
  --in:#0B7A43; --in-bg:#E3F5EB; --out:#B4321F; --out-bg:#FCE9E6;
  --warn:#8A5A00; --warn-bg:#FFF3D6; --verified:#0067B8;
  --hero:#002E6E; --hero-ink:#FFFFFF; --hero-muted:#B9CDEA;
  --shadow:0 1px 2px rgba(0,30,70,.06),0 4px 14px rgba(0,30,70,.06);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --font:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#8FB4FF; --cyan:#00BAF2; --action:#3BC4F5; --action-ink:#04172F;
    --bg:#0A1424; --surface:#111E33; --surface-2:#1A2A44; --surface-3:#22365A;
    --text:#E8EEF7; --muted:#9AAAC2; --border:#263A5A;
    --in:#4ADE95; --in-bg:#0F2E22; --out:#FF8A7A; --out-bg:#3A1A17;
    --warn:#FFC966; --warn-bg:#3A2C0A; --verified:#3BC4F5;
    --hero:#0F2A57; --hero-ink:#FFFFFF; --hero-muted:#A9BEDD;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#8FB4FF; --cyan:#00BAF2; --action:#3BC4F5; --action-ink:#04172F;
  --bg:#0A1424; --surface:#111E33; --surface-2:#1A2A44; --surface-3:#22365A;
  --text:#E8EEF7; --muted:#9AAAC2; --border:#263A5A;
  --in:#4ADE95; --in-bg:#0F2E22; --out:#FF8A7A; --out-bg:#3A1A17;
  --warn:#FFC966; --warn-bg:#3A2C0A; --verified:#3BC4F5;
  --hero:#0F2A57; --hero-ink:#FFFFFF; --hero-muted:#A9BEDD;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
svg:not([width]){width:1.15em;height:1.15em;flex:none}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:inline}}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:inline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- demo bar ---------- */
.demobar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.demobar .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.demobar .brand img{height:22px;width:auto}
.demobar .brand span{font-weight:700;color:var(--navy);white-space:nowrap}
.demobar .brand small{color:var(--muted);font-size:13px;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg svg{width:16px;height:16px}
@media (max-width:640px){.demobar{gap:6px;padding:8px 10px;flex-wrap:nowrap}.demobar .brand small{display:none}.seg button .lbl{display:none}.seg button{padding:4px 8px;min-height:30px}.demobar .seg button.txt .lbl{display:inline}}
@media (max-width:480px){.demobar .brand span{display:none}}

/* ---------- stage ---------- */
.stage{min-height:calc(100% - 56px)}
.demobar{min-height:56px}
.mode-mobile .stage{display:flex;justify-content:center;padding:20px 12px}
.phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 100px));background:var(--bg);border-radius:32px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,30,70,.18);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:640px){.mode-mobile .stage{padding:0}.phone{max-width:none;height:calc(100vh - 56px);border-radius:0;border:0;box-shadow:none}}

.m-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
.m-head .shop{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.m-head .shop b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-head .shop small{color:var(--muted);font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--surface-2);color:var(--navy)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--out);border-radius:50%;border:2px solid var(--surface)}
.m-scroll{flex:1;overflow-y:auto;padding:14px 14px 96px}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0;min-height:48px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--action)}
.tabbar .fab-slot{position:relative}
.fab{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--action);color:var(--action-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,103,184,.35);border:4px solid var(--surface)}
.fab svg{width:26px;height:26px}
.tabbar .fab-slot span{margin-top:30px}

/* ---------- desktop ---------- */
.mode-desktop .stage{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side .shopcard{display:flex;gap:10px;align-items:center;padding:6px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.side .shopcard b{display:block;font-size:15px;line-height:1.2}
.side .shopcard small{color:var(--muted);font-size:13px}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);text-align:left;width:100%}
.navbtn svg{width:20px;height:20px}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current="page"]{background:var(--surface-2);color:var(--action)}
.side .scanbtn{margin-top:auto}
.d-main{padding:24px 32px 48px;max-width:1240px;width:100%}
.d-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.d-top h1{font-size:26px;margin:0;line-height:1.2}
.d-top .sub{color:var(--muted);font-size:15px}
.d-top .spacer{flex:1}
.grid-2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,1fr);gap:18px;align-items:start}
.grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.mode-desktop .stack{gap:18px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card h2,.sec-title{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;line-height:1.25}
.card h2 .more,.sec-title .more{margin-left:auto;font-size:14px;font-weight:600;color:var(--action)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.hero{background:var(--hero);color:var(--hero-ink);border:0;position:relative;overflow:hidden}
.hero .muted{color:var(--hero-muted)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(0,186,242,.18)}
.galla{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;position:relative;z-index:1}
.galla .k{font-size:14px;display:flex;align-items:center;gap:6px}
.galla .v{font-size:26px;font-weight:800;line-height:1.1}
.galla .k svg{width:16px;height:16px}
.in-c{color:#5EF0A8}.out-c{color:#FFB3A8}
.netline{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;align-items:end;position:relative;z-index:1}
.bars{display:flex;gap:5px;align-items:end;height:40px}
.bars i{display:block;width:9px;border-radius:3px 3px 0 0;background:rgba(255,255,255,.35)}
.bars i.o{background:rgba(255,179,168,.75)}
.bars .pair{display:flex;gap:2px;align-items:end}

.duecard{border-left:5px solid var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;line-height:1.5;white-space:nowrap}
.pill svg{width:13px;height:13px}
.p-due{background:var(--warn-bg);color:var(--warn)}
.p-over{background:var(--out-bg);color:var(--out)}
.p-paid{background:var(--in-bg);color:var(--in)}
.p-info{background:var(--surface-2);color:var(--navy)}
.p-pend{background:var(--warn-bg);color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15.5px;background:var(--action);color:var(--action-ink)}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--surface-2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--action);padding:0 10px}
.btn.block{width:100%}
.btn.lg{min-height:54px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode-desktop .tiles{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--surface-2);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent}
.tile:hover{border-color:var(--action)}
.tile .avatar{width:44px;height:44px;font-size:15px}
.tile b{font-size:13.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.tile .amt{font-size:13.5px;color:var(--muted);font-weight:600}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;line-height:1.15;padding:6px 2px}
.qa .ic{width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--action)}
.qa .ic svg{width:22px;height:22px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .body b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.li .body small{color:var(--muted);font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;flex:none}
.li .end b{display:block;font-size:15.5px}
.amt-in{color:var(--in)}.amt-out{color:var(--out)}
.vbadge{display:inline-flex;vertical-align:-2px;color:var(--verified);margin-left:4px}
.vbadge svg{width:15px;height:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted);border:1px solid transparent;min-height:36px}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--action);color:var(--action)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 12px;min-height:46px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:15.5px}

.score-teaser{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--action),var(--cyan));border-radius:99px}

.banner{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px}
.banner .ic{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--action);flex:none}
.banner .ic svg{width:22px;height:22px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:12px;background:var(--surface-2);font-size:12.5px;color:var(--muted);font-weight:600;gap:2px}
.week button b{font-size:17px;color:var(--text)}
.week button[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.week button[aria-pressed="true"] b{color:var(--action-ink)}
.week .mk{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.week button[aria-pressed="true"] .mk{background:var(--action-ink)}
.week .mk.none{visibility:hidden}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .d{min-width:0}
.cal .h{font-size:12.5px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{min-height:74px;border-radius:10px;background:var(--surface-2);padding:6px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.cal .d.today{outline:2px solid var(--action)}
.cal .d.blank{background:transparent}
.cal .d .e{font-size:11.5px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--warn-bg);color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .e.ov{background:var(--out-bg);color:var(--out)}
.cal .d .e.pd{background:var(--in-bg);color:var(--in)}

table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.nw{white-space:nowrap}
.galla b,.galla .v{white-space:nowrap}
.scrollx{overflow-x:auto}

.catbar{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.catbar .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.catbar .t i{display:block;height:100%;background:var(--action);border-radius:99px}

/* ---------- sheet / panel ---------- */
.scrim{position:absolute;inset:0;background:rgba(4,16,36,.45);z-index:20;opacity:0;animation:fade .18s forwards}
.mode-desktop .scrim{position:fixed;z-index:60}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;display:flex;flex-direction:column;transform:translateY(100%);animation:up .24s cubic-bezier(.2,.8,.2,1) forwards}
.mode-desktop .sheet{z-index:61;position:fixed;left:auto;top:0;right:0;bottom:0;width:440px;max-height:none;border-radius:0;transform:translateX(100%);animation:right .24s cubic-bezier(.2,.8,.2,1) forwards;border-left:1px solid var(--border)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--border);margin:8px auto 0}
.mode-desktop .sheet .grab{display:none}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.sheet .sh-head h3{margin:0;font-size:18px;flex:1}
.sheet .sh-body{overflow-y:auto;padding:6px 16px 16px;flex:1}
.sheet .sh-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
@keyframes up{to{transform:translateY(0)}}
.sheet.still,.scrim.still{animation:none;transform:none;opacity:1}
@keyframes right{to{transform:translateX(0)}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation-duration:.01s}}

.payee{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface-2);border-radius:14px}
.bigamt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:40px;font-weight:800;padding:10px 0 2px}
.bigamt input{width:7.5ch;border:0;background:transparent;font-size:40px;font-weight:800;text-align:left;outline:0;font-variant-numeric:tabular-nums;padding:0}
.bigamt input:focus{border-bottom:2px solid var(--action)}
.field{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border)}
.field .lab{color:var(--muted);font-size:14px;width:92px;flex:none}
.field .val{flex:1;font-weight:600;min-width:0}
.field select{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:7px 10px;width:100%}
.notice{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14.5px;margin-top:12px}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px}
.notice.info{background:var(--surface-2);color:var(--text)}
.opt{display:flex;gap:10px;padding:12px;border:1.5px solid var(--border);border-radius:12px;margin-top:8px;text-align:left;width:100%;align-items:flex-start}
.opt[aria-pressed="true"]{border-color:var(--action);background:var(--surface-2)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed="true"] .radio{border-color:var(--action)}
.opt[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--action)}
.trust{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--muted);font-size:13px;margin-top:10px}
.trust svg{width:15px;height:15px}

.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--text);border-color:var(--text)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.pinpad button{min-height:56px;border-radius:14px;background:var(--surface-2);font-size:24px;font-weight:700}
.pinpad button:active{background:var(--surface-3)}
.pinpad svg{width:24px;height:24px}

.status{text-align:center;padding:10px 0}
.status .big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:8px auto 10px}
.status .big svg{width:44px;height:44px}
.st-ok .big{background:var(--in-bg);color:var(--in)}
.st-pend .big{background:var(--warn-bg);color:var(--warn)}
.st-fail .big{background:var(--out-bg);color:var(--out)}
.st-ok .big svg{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--surface-2);border-top-color:var(--action);animation:spin .9s linear infinite;margin:30px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.receipt{background:var(--surface-2);border-radius:14px;padding:4px 14px;margin-top:14px;text-align:left}
.receipt .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14.5px}
.receipt .r:last-child{border-bottom:0}
.receipt .r span:first-child{color:var(--muted)}
.wa{background:#E7F7EC;color:#10301C;border-radius:14px;padding:12px;margin-top:12px;text-align:left;font-size:14px}
:root[data-theme="dark"] .wa{background:#103222;color:#DDF5E5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#103222;color:#DDF5E5}}
.wa .who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;margin-bottom:6px}
.wa .who svg{width:16px;height:16px;color:#1FA855}
.wa .bubble{background:rgba(255,255,255,.75);border-radius:10px;padding:8px 10px;white-space:pre-line}
:root[data-theme="dark"] .wa .bubble{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa .bubble{background:rgba(0,0,0,.25)}}
.gains{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gains div{background:var(--surface-2);border-radius:12px;padding:8px;font-size:13px;text-align:center;line-height:1.2}
.gains b{display:block;font-size:15px;color:var(--action)}

.scanner{position:relative;aspect-ratio:1/1;max-width:300px;margin:4px auto 14px;border-radius:20px;background:repeating-linear-gradient(45deg,#13233c,#13233c 10px,#162a47 10px,#162a47 20px);overflow:hidden}
.scanner::before{content:"";position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px}
.scanner::after{content:"";position:absolute;left:18%;right:18%;top:20%;height:3px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:scan 2s ease-in-out infinite alternate}
@keyframes scan{to{top:78%}}
@media (prefers-reduced-motion:reduce){.scanner::after{animation:none}}
.scanner p{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#DCE7F4;font-size:13px;margin:0}
.qrbrand{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0E1B2E;color:#fff;padding:12px 16px;border-radius:14px;z-index:100;font-size:14.5px;display:flex;gap:10px;align-items:center;max-width:min(92vw,440px);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s}
:root[data-theme="dark"] .toast{background:#E8EEF7;color:#0E1B2E}
.toast svg{width:20px;height:20px;flex:none}
.sbx{position:fixed;right:16px;top:68px;z-index:99;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;max-width:340px;animation:fade .2s}
.mode-desktop .sbx{top:auto;bottom:24px;left:260px;right:auto}
.sbx .spk{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff;flex:none}
:root[data-theme="dark"] .sbx .spk{background:#0F2A57}
.sbx .spk svg{width:22px;height:22px}
.sbx small{color:var(--muted);display:block;font-size:12.5px}
.sbx b{font-size:14.5px;line-height:1.3;display:block}

.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.ladder{display:grid;gap:10px}
.lvl{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2)}
.lvl.cur{outline:2px solid var(--action);background:var(--surface)}
.lvl .badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--surface);color:var(--navy)}
.lvl.done .badge{background:var(--in-bg);color:var(--in)}
.lvl.cur .badge{background:var(--action);color:var(--action-ink)}
.lvl b{display:block}
.setup-prog{display:flex;gap:6px;margin:8px 0 4px}
.setup-prog i{flex:1;height:8px;border-radius:9px;background:var(--surface-2)}
.setup-prog i.f{background:var(--in)}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--action)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv span:nth-child(odd){color:var(--muted)}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.hide-d{}
.mode-desktop .hide-d{display:none!important}
.mode-mobile .hide-m{display:none!important}
.welcome-slide{text-align:center;padding:10px 6px}
.welcome-slide h2{display:block!important;text-align:center}
.welcome-slide .art{width:120px;height:120px;border-radius:32px;margin:6px auto 14px;display:grid;place-items:center;background:var(--surface-2);color:var(--action)}
.welcome-slide .art svg{width:60px;height:60px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--action);width:22px;border-radius:9px}

/* ===== v2 additions ===== */
:root{ --scan-bg:#00BAF2; --scan-ink:#002E6E; --scan-ring:#FFFFFF; }
:root[data-theme="dark"]{ --scan-bg:#00BAF2; --scan-ink:#04172F; --scan-ring:#111E33; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --scan-bg:#00BAF2; --scan-ink:#04172F; --scan-ring:#111E33; } }

/* tab bar with an in-bar scan button (clearly visible in both themes) */
.tabbar{grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,30,70,.06)}
.tabbar .scan-tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--text);min-height:48px;padding:0}
.tabbar .scan-tab .scan-ic{width:54px;height:54px;border-radius:18px;background:var(--scan-bg);color:var(--scan-ink);display:grid;place-items:center;margin-top:-22px;border:4px solid var(--scan-ring);box-shadow:0 6px 16px rgba(0,120,190,.35)}
.tabbar .scan-tab .scan-ic svg{width:28px;height:28px;stroke-width:2.4}
.tabbar .scan-tab:active .scan-ic{transform:scale(.96)}
.side .scanbtn{background:var(--scan-bg);color:var(--scan-ink)}

/* persona picker */
.pic{display:grid;place-items:center;border-radius:12px;flex:none}
.pic svg{width:58%;height:58%}
.persona-wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}
.persona-wrap h1{font-size:28px;line-height:1.15;margin:6px 0 6px}
.persona-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.mode-mobile .persona-grid{grid-template-columns:1fr}
.pcard{display:flex;gap:14px;text-align:left;padding:16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow);align-items:flex-start;width:100%}
.pcard:hover,.pcard:focus-visible{border-color:var(--action)}
.pcard[aria-current="true"]{border-color:var(--action);background:var(--surface-2)}
.pcard .pic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.pcard .pic svg{width:28px;height:28px}
.pcard b{font-size:17px;display:block;line-height:1.2}
.pcard .who{font-size:13.5px;color:var(--muted);margin:2px 0 6px}
.pcard .pain{font-size:14px;line-height:1.35}
.pcard > div{flex:1;min-width:0}
.pcard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.persona-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;min-height:34px;color:var(--text)}
.persona-chip .pic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.persona-chip .pic svg{width:15px;height:15px}
@media (max-width:640px){.persona-chip .pname,.persona-chip > svg{display:none}.persona-chip{padding:4px;min-height:30px}.demobar .brand img{height:18px}.seg button{padding:4px 7px}}

/* source tag for dues and amounts */
.src{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.src svg{width:13px;height:13px}
.amt-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.amt-chips button{padding:4px 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;min-height:32px}
.est{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}

/* focus card */
.focus{display:flex;gap:12px;align-items:flex-start;border-left:5px solid var(--cyan)}
.focus .fi{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--action);flex:none}
.focus .fi svg{width:22px;height:22px}

/* more grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode-desktop .mgrid{grid-template-columns:repeat(4,1fr)}
.mgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:14px;background:var(--surface-2);text-align:left;min-height:96px;border:1px solid transparent}
.mgrid button:hover{border-color:var(--action)}
.mgrid button svg{width:22px;height:22px;color:var(--action)}
.mgrid button b{font-size:14px;line-height:1.2}
.mgrid button small{font-size:12px;color:var(--muted);line-height:1.25}
.mgrid .tagnew{font-size:10.5px;font-weight:800;color:var(--in);background:var(--in-bg);padding:0 6px;border-radius:6px}

/* rate memory */
.rate-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 2px;border-bottom:1px solid var(--border)}
.rate-row:last-child{border-bottom:0}
.spark{display:flex;gap:3px;align-items:end;height:26px}
.spark i{width:7px;border-radius:2px;background:var(--surface-3)}
.spark i:last-child{background:var(--action)}
.trend-up{color:var(--out);font-weight:700}
.trend-dn{color:var(--in);font-weight:700}

/* voice */
.mic{width:96px;height:96px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:var(--action);color:var(--action-ink);position:relative}
.mic svg{width:42px;height:42px}
.mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--cyan);opacity:.6;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.8}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic::after{animation:none}}
.heard{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center;font-size:18px;font-weight:700;margin:8px 0}
.icon-btn.mic-btn{color:var(--action)}

/* fees */
.fee{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border)}
.fee:last-child{border-bottom:0}
.fee b.zero{color:var(--in)}
.inputrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.inputrow input,.inputrow select{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:44px}
.cn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--in-bg);color:var(--in);margin-top:10px;font-size:14.5px;width:100%;text-align:left}
.cn .toggle{margin-left:auto}
.persona-banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-size:14px}

/* ===== v3 ===== */
.role-seg button[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
@media (max-width:480px){.hide-sm{display:none}}
.req-card{border-left:5px solid var(--cyan)}
.thread{display:flex;flex-direction:column;padding:4px 0 8px}
.bub-row{display:flex;margin:5px 0}
.bub-row.me{justify-content:flex-end}
.bub-row.sys{justify-content:center}
.bub{max-width:84%;padding:8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14.5px;line-height:1.35}
.bub svg{width:14px;height:14px;vertical-align:-2px}
.bub-row.them .bub{border-bottom-left-radius:4px}
.bub-row.me .bub{background:var(--action);color:var(--action-ink);border-color:transparent;border-bottom-right-radius:4px}
.bub small{display:block;opacity:.8;font-size:11.5px;margin-top:3px}
.bub-row.sys .bub{background:transparent;border:0;color:var(--muted);font-size:12px;text-align:center;padding:2px 8px}
.agr{width:100%;max-width:460px;border:1.5px solid var(--border);border-radius:18px;background:var(--surface);padding:14px;box-shadow:var(--shadow)}
.bub-row.me .agr{border-color:var(--action)}
.agr.closed{opacity:.85}
.agr .tg{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;margin:6px 0}
.agr .tg span:nth-child(odd){color:var(--muted)}
.agr-acts .btn{min-height:40px;padding:0 14px;font-size:14.5px}
.mode-desktop .chat-head{position:sticky;top:64px;z-index:3}
.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 6px;border-top:1px solid var(--border);z-index:3}
.mode-mobile .composer{bottom:-96px;padding-bottom:100px;margin-bottom:-96px}
.composer .inputrow{margin:6px 0 0}
.composer .btn{min-height:44px;padding:0 14px}
.sp{padding:10px 0;border-bottom:1px solid var(--border)}
.sp:last-of-type{border-bottom:0}
.offer{padding:12px 0;border-bottom:1px solid var(--border)}
.offer:last-of-type{border-bottom:0}
i.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pill svg{width:13px;height:13px}
button.pill{cursor:pointer;border:0}

@media (max-width:480px){.view-seg{display:none}.demobar .brand img{height:16px}}
.sh-body .chips{flex-wrap:wrap;overflow:visible}

/* ===== v4: calmer shell ===== */
.demobar{gap:10px}
.bar-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surface-2);color:var(--text);font-weight:700;font-size:14px;text-decoration:none}
.bar-btn svg{width:17px;height:17px}
.disp-wrap{position:relative}
.disp-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 32px rgba(0,30,70,.18);padding:10px 12px;z-index:80;display:grid;gap:8px;min-width:280px}
.dp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--muted)}
.dp-row .seg .lbl{display:inline!important}
@media (max-width:640px){.bar-btn span{display:none}.bar-btn{padding:0 9px;min-height:32px}.disp-pop{position:fixed;left:10px;right:10px;top:54px;min-width:0}}
.menu-btn{background:var(--surface-2)}
.menu-btn.on{background:var(--action);color:var(--action-ink)}
.hero-link{width:100%;text-align:left;color:inherit;align-items:center}
.focus-row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-left:5px solid var(--cyan);color:var(--text)}
.focus-row .fi{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--action);flex:none}
.focus-row .fi svg{width:21px;height:21px}
.mgrid button{min-height:84px;justify-content:center}
.demo-cta{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--hero);color:#fff;text-decoration:none;margin:4px 0 22px}
.demo-cta>svg{width:30px;height:30px;color:var(--cyan);flex:none}
.demo-cta b{display:block;font-size:16px}
.demo-cta span{font-size:14px;color:var(--hero-muted)}
.demo-cta div{flex:1}
.pcard .pain{color:var(--muted)}

</style>

      ${chips.length?`<div class="amt-chips">${chips.map(a=>`<button data-act="setamt" data-v="${a}">${inr(a)}</button>`).join('')}</div>`:''}
      ${agrBlock(p,s)}<div class="field"><span class="lab">Tag</span><div class="val"><select data-sinp="cat" aria-label="Category">${[...new Set([p.cat,...D.sup.map(x=>x.cat)])].map(x=>`<option ${x===p.cat?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="field"><span class="lab">Bill</span><div class="val">${p.inv?`<span class="pill p-paid">${ic('file')}${esc(p.inv)}</span>`:`<button class="btn ghost" style="padding:0;min-height:auto" data-act="attach">${ic('camera')}Snap or attach bill</button>`}</div></div>
      <div class="field"><span class="lab">Pay from</span><div class="val"><select data-sinp="source" aria-label="Pay from"><option value="bank" ${!fromCredit?'selected':''}>${PC().bank} (bank)</option><option value="credit" ${fromCredit?'selected':''}>Paytm credit line · ${inr(D.credit.limit-D.credit.used)} available</option></select></div></div>
      ${s.cn?`<button class="cn" data-act="usecn">${ic('ret')}<span>Adjust credit note <b>${inr(s.cn)}</b> from your return claim</span><span class="toggle" role="switch" aria-checked="${!!p.useCn}"></span></button>`:''}
      ${fromCredit?`<div class="notice">${ic('alert')}<span>This is a loan from ${D.credit.lender}. Repaid automatically from your settlements.</span></div>`:''}
      ${over?`<div class="notice">${ic('alert')}<span><b>UPI allows ${inr(lim)} ${s.p2m?'per payment':'per day'} to this payee.</b> Choose how to pay the rest:</span></div>
        <button class="opt" data-act="split" data-v="neft" aria-pressed="${p.split!=='days'}"><span class="radio"></span><span><b>${inr(lim)} by UPI + ${inr(net-lim)} by NEFT now</b><br><span class="small muted">One entry in your book. NEFT reaches in ~30 minutes.</span></span></button>
        <button class="opt" data-act="split" data-v="days" aria-pressed="${p.split==='days'}"><span class="radio"></span><span><b>Split over ${Math.ceil(net/lim)} days by UPI</b><br><span class="small muted">The Soundbox reminds you each morning.</span></span></button>`:''}`;
    const payAmt = over&&p.split==='days'?lim:net;
    return ['Pay '+(s.name.length>24?s.name.slice(0,22)+'…':s.name), b, `<button class="btn block lg" data-act="topin" ${!(net>0)?'disabled':''}>${ic('lock')}Pay ${inr(payAmt)}</button><div class="trust">${ic('shield')}Secured by UPI · processed via partner bank</div>`];
  }
  if(p.step==='pin') return ['Enter UPI PIN',`<div style="text-align:center"><div class="small muted">Paying ${esc(s.name)}</div><b class="num" style="font-size:30px">${inr(p.payNow)}</b>${p.neft?`<div class="small muted">+ ${inr(p.neft)} by NEFT after this</div>`:''}<div class="small muted">from ${p.source==='credit'?'Paytm credit line':PC().bank}</div>
      <div class="pin-dots" aria-label="${p.pin.length} of 6 digits entered">${[...Array(6)].map((_,i)=>`<i class="${i<p.pin.length?'f':''}"></i>`).join('')}</div><p class="tiny muted" style="margin:-8px 0 12px">Demo: enter any 6 digits</p>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-v="${n}">${n}</button>`).join('')}<button data-act="pindel" aria-label="Delete">${ic('del')}</button><button data-act="pin" data-v="0">0</button><button data-act="pinok" aria-label="Submit" style="background:var(--action);color:var(--action-ink)">${ic('check')}</button></div></div>`,''];
  if(p.step==='processing') return ['Paying…',`<div style="text-align:center"><div class="spinner" role="status" aria-label="Processing"></div><b>Sending ${inr(p.payNow)} to ${esc(s.name)}</b><p class="small muted">This takes a few seconds.</p></div>`,''];
  const r=p.result;
  if(r==='success'){ const proof=S.waProof&&s.proof!==false;
    return ['Payment successful',`<div class="status st-ok"><div class="big">${ic('checkc')}</div><b style="font-size:22px">Paid ${inr(p.payNow+(p.neft||0))}</b><div class="small muted">to ${esc(s.name)} · ${fmtTime(Date.now())}</div>
      <div class="receipt"><div class="r"><span>UPI ref (UTR)</span><b class="num">${p.utr}</b></div>${p.neft?`<div class="r"><span>NEFT ${inr(p.neft)}</span><b>Processing · ~30 min</b></div>`:''}${p.cnUsed?`<div class="r"><span>Credit note adjusted</span><b class="amt-in">${inr(p.cnUsed)}</b></div>`:''}<div class="r"><span>Tag</span><b>${esc(p.cat)}</b></div><div class="r"><span>Bill</span><b>${esc(p.inv||'—')}</b></div><div class="r"><span>Paid from</span><b>${p.source==='credit'?'Paytm credit line':PC().bank}</b></div></div>
      ${proof?`<div class="wa"><div class="who">${ic('wa')}Sent to ${esc(s.name)} on WhatsApp</div><div class="bubble">✅ Payment received from ${esc(PC().shop)}
₹${Math.round(p.payNow+(p.neft||0)).toLocaleString('en-IN')} · UTR ${p.utr}${p.inv?'\nInvoice: '+esc(p.inv):''}
${fmtDate(Date.now(),{day:'numeric',month:'short',year:'numeric'})}, ${fmtTime(Date.now())}</div></div>`:''}
      <div class="gains"><div><b>${ic('book').replace('<svg','<svg style="width:16px;height:16px"')}</b>Added to book</div><div><b>+${p.pts}</b>score points</div><div><b>${ic('wa').replace('<svg','<svg style="width:16px;height:16px"')}</b>Proof sent</div></div></div>`,
      `<div class="row" style="gap:8px"><button class="btn sec" style="flex:1" data-act="toast" data-m="Receipt shared">${ic('wa')}Share</button><button class="btn" style="flex:2" data-act="close">Done</button></div>`]; }
  if(r==='pending') return ['Payment pending',`<div class="status st-pend"><div class="big">${ic('clock')}</div><b style="font-size:20px">Bank is confirming ${inr(p.payNow)}</b><p class="small muted">Your money is safe. Most payments confirm within 2 minutes. We’ll tell you here and on the Soundbox.</p>
      <div class="receipt" style="text-align:left"><div class="r"><span>Sent from ${PC().bank}</span><span>${fmtTime(Date.now())}</span></div><div class="r"><span>Waiting for ${esc(short(s.name))}’s bank</span><span>now</span></div><div class="r"><span>UTR</span><span class="num">${p.utr}</span></div></div></div>`,
      `<button class="btn block lg" data-act="callback">${ic('phonecall')}Call me back in 30 min</button><button class="btn ghost block" data-act="resolve" style="margin-top:4px">Check status now</button>`];
  return ['Payment failed',`<div class="status st-fail"><div class="big">${ic('x')}</div><b style="font-size:20px">Payment did not go through</b><p class="small">No money was taken from your account.</p><p class="small muted">Reason: ${esc(short(s.name))}’s bank did not respond in time. This usually clears in a few minutes.</p></div>`,
    `<button class="btn block lg" data-act="retry">${ic('refresh')}Try again</button><button class="btn ghost block" data-act="callback" style="margin-top:4px">Talk to us</button>`];
}

/* ---------- actions ---------- */
function openPay(sid, amount, extra={}){ const s=sid==='new'?newSupObj():sup(sid);
  S.sheet=Object.assign({kind:'pay',step:'confirm',s:sid,amount:Number(amount)||0,cat:s.cat,source:'bank',pin:'',split:'neft',inv:'',from:'again',useCn:!!s.cn},extra); render();
  if(S.sheet.from==='scan') setTimeout(()=>document.getElementById('amt')?.focus(),80); }
function toast(msg, icon='check'){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.innerHTML=ic(icon)+`<span>${msg}</span>`; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }
function soundbox(text, spoken){ document.querySelectorAll('.sbx').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='sbx'; el.setAttribute('role','status');
  el.innerHTML=`<div class="spk">${ic('speaker')}</div><div><small>Paytm Soundbox</small><b>“${text}”</b></div>`; document.body.appendChild(el); setTimeout(()=>el.remove(),5200);
  try{ if(S.soundbox&&'speechSynthesis' in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(spoken||text); const v=speechSynthesis.getVoices().find(v=>/hi-IN/i.test(v.lang)); if(v){u.voice=v;u.lang='hi-IN';}else u.lang='en-IN'; u.rate=.95; speechSynthesis.speak(u);} }catch(e){} }
function completePay(){
  const p=S.sheet; const s=p.s==='new'?newSupObj():sup(p.s); p.utr=utr(); p.result=S.outcome; p.step='result';
  if(p.result==='success'){
    D.pays.push({id:'p'+Date.now(),sid:p.s,amount:p.payNow+(p.neft||0),mode:p.neft?'UPI + NEFT':p.source==='credit'?'Credit line':'UPI',status:'SUCCESS',utr:p.utr,cat:p.cat,ts:Date.now(),inv:p.inv,bill:!!p.inv});
    if(p.source==='credit') D.credit.used+=p.payNow; if(p.cnUsed&&s.id!=='new'){ s.cn-=p.cnUsed; D.returns=D.returns.filter(r=>!(r.sid===s.id&&/approved/i.test(r.st))); }
    p.pts=8+Math.min(12,Math.round(p.payNow/5000)); D.score=Math.min(900,D.score+Math.round(p.pts/4));
    if(p.agrId){ applyAgrPayment(p); } else if(p.dueId){ const d=D.dues.find(x=>x.id===p.dueId); if(d) d.paid=true; }
    if(p.billId&&!p.agrId){ const bl=D.bills.find(b=>b.id===p.billId); if(bl) bl.status='PAID'; const dd=D.dues.find(d=>d.bill===p.billId); if(dd) dd.paid=true; }
    save(); const nm=short(s.name); setTimeout(()=>soundbox(`${nm} ko ${inr(p.payNow+(p.neft||0))} bhej diye`,`${nm} को ${Math.round(p.payNow+(p.neft||0))} रुपये भेज दिए`),400);
  }
  render();
}
function focusAction(){
  const pk=S.persona;
  if(pk==='kirana'){ const bl=D.bills.find(b=>b.status==='OPEN'&&b.disc); if(bl) return payBill(bl.id); }
  if(pk==='pharmacy'||pk==='wholesale'){ S.route=pk==='pharmacy'?'returns':'udhar'; S._scroll=0; return render(); }
  if(pk==='hardware'){ const d=openDues().find(x=>x.amount>100000&&!sup(x.sid).p2m); if(d) return payDue(d.id); }
  if(pk==='restaurant'){ const items=openDues().filter(d=>d.src==='recur'&&d.due<=today0&&d.amount<10000).map(d=>({sid:d.sid,amount:d.amount,label:d.note,dueId:d.id})); if(items.length){ S.sheet={kind:'bulk',items,title:'Pay today’s vendors',note:'Veg, meat and milk – each tagged to food cost.'}; return render(); } }
  if(pk==='salon'){ const items=openDues().filter(d=>d.src==='manual').map(d=>({sid:d.sid,amount:d.amount,label:d.note,dueId:d.id})); if(items.length){ S.sheet={kind:'bulk',items,title:'Pay stylist commissions',note:'Commission = services done this week × 15%. Slips go on WhatsApp.'}; return render(); } }
  toast('All done for today');
}
function payDue(id){ const d=D.dues.find(x=>x.id===id); const bl=d.bill?D.bills.find(b=>b.id===d.bill):null; const sv=d.disc&&d.discBy>=today0?Math.round(d.amount*d.disc/100):0; openPay(d.sid,d.amount-sv,{dueId:d.id,inv:bl?bl.inv:(d.src==='credit'?d.note.split(' ')[0]:''),billId:d.bill,from:'due',src:d.src}); }
function payBill(id){ const bl=D.bills.find(b=>b.id===id); const sv=bl.disc&&bl.discBy>=today0?Math.round(bl.amount*bl.disc/100):0; const dd=D.dues.find(d=>d.bill===bl.id); openPay(bl.sid,bl.amount-sv,{inv:bl.inv,billId:bl.id,dueId:dd?.id,from:'bill'}); }
function staffItems(){ return D.sup.filter(s=>['Staff','Wages'].includes(s.cat)).map(s=>({sid:s.id,amount:s.usual,label:s.cat==='Wages'?'Daily wages':'Monthly salary'})); }
function parseVoice(txt){ const low=txt.toLowerCase(); const num=Number((low.replace(/,/g,'').match(/\d+/)||[])[0]||0);
  const s=D.sup.find(x=>low.includes(x.name.toLowerCase().split(' ')[0])); return s?{sid:s.id,amount:num||(lastPay(s.id)?.amount||s.usual)}:null; }

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act; const sc=root.querySelector('.m-scroll'); if(sc) S._scroll=sc.scrollTop;
  switch(a){
    case 'set': S[el.dataset.k]=el.dataset.v; save(); render(); break;
    case 'pick': S.picking=true; S.sheet=null; render(); window.scrollTo(0,0); break;
    case 'persona': S.persona=el.dataset.v; S.picking=false; S.route='home'; S.sheet=null; S.setup=null; S.welcomeIdx=0; S.payFilter='All'; S.bookCat='All'; S.supQuery=''; S._scroll=0; loadPersona(S.persona); save(); render(); break;
    case 'go': S.route=el.dataset.r; S.sheet=null; S._scroll=0; if(S.route==='setup'&&S.setup&&S.setup.added.length>=5) S.setup=null; render(); window.scrollTo(0,0); break;
    case 'back': S.route=S.route==='supplier'?'pay':(['notifs'].includes(S.route)?'home':'more'); S._scroll=0; render(); break;
    case 'scan': S.sheet={kind:'scan'}; render(); break;
    case 'scanned': if(el.dataset.s==='new'){ S.sheet={kind:'newsup'}; render(); } else { const s=sup(el.dataset.s); openPay(s.id,0,{from:'scan'}); } break;
    case 'savenew': { const c=candidates()[0]; const id=S.persona+'n'+Date.now(); D.sup.push({id,name:c.name,vpa:c.vpa,vpaName:c.vpaName,cat:S.sheet.cat||c.cat,usual:c.usual,freq:S.sheet.freq||'Weekly',credit:0,qr:c.qr,p2m:true,verified:true,proof:true,cn:0}); save(); toast(c.name+' saved as a supplier'); openPay(id,0,{from:'scan'}); break; }
    case 'paynosave': openPay('new',0,{from:'scan'}); break;
    case 'pay': openPay(el.dataset.s, el.dataset.a, {from:el.dataset.from||'again'}); break;
    case 'paydue': payDue(el.dataset.d); break;
    case 'focus': focusAction(); break;
    case 'usecredit': { const s=freqSuppliers().find(x=>x.credit>0)||D.sup[0]; S.route='pay'; openPay(s.id,s.usual,{source:'credit',from:'credit'}); break; }
    case 'close': S.sheet=null; render(); break;
    case 'setamt': S.sheet.amount=+el.dataset.v; render(); break;
    case 'usecn': S.sheet.useCn=!S.sheet.useCn; render(); break;
    case 'topin': { const p=S.sheet; const s=p.s==='new'?newSupObj():sup(p.s); const lim=limitFor(s); const cn=p.useCn?Math.min(s.cn||0,p.amount):0; const net=p.amount-cn; p.cnUsed=cn;
      if(net>lim){ p.payNow=lim; p.neft=p.split==='days'?0:net-lim; } else { p.payNow=net; p.neft=0; }
      if(p.source==='credit'&&p.payNow>D.credit.limit-D.credit.used){ toast('Amount is more than your available credit','alert'); return; } p.step='pin'; p.pin=''; render(); break; }
    case 'pin': if(S.sheet.pin.length<6){ S.sheet.pin+=el.dataset.v; render(); if(S.sheet.pin.length===6) setTimeout(()=>{ S.sheet.step='processing'; render(); setTimeout(completePay,1300); },200);} break;
    case 'pindel': S.sheet.pin=S.sheet.pin.slice(0,-1); render(); break;
    case 'pinok': if(S.sheet.pin.length===6){ S.sheet.step='processing'; render(); setTimeout(completePay,1300);} else toast('Enter all 6 digits','alert'); break;
    case 'split': S.sheet.split=el.dataset.v; render(); break;
    case 'attach': S.sheet.inv='SN-'+(1000+Math.floor(Math.random()*900)); toast('Bill read: invoice '+S.sheet.inv); render(); break;
    case 'retry': S.sheet.step='confirm'; render(); break;
    case 'resolve': { const o=S.outcome; S.outcome='success'; completePay(); S.outcome=o; break; }
    case 'callback': toast('Done. A Paytm expert will call you by '+fmtTime(Date.now()+30*6e4),'phonecall'); D.tickets.unshift({id:'TK-'+Math.floor(58300+Math.random()*600),t:'Call-back requested',st:'Calling by '+fmtTime(Date.now()+30*6e4),ts:Date.now()}); save(); S.sheet=null; render(); break;
    case 'bill': S.sheet={kind:'bill',b:el.dataset.b}; render(); break;
    case 'paybill': payBill(el.dataset.b); break;
    case 'schedbill': { const bl=D.bills.find(b=>b.id===el.dataset.b); S.sheet=null; render(); toast(`Scheduled for ${fmtDate(bl.due)}. We’ll remind you that morning.`,'cal'); break; }
    case 'export': S.sheet={kind:'export'}; render(); break;
    case 'doexport': S.sheet=null; render(); toast('Sent to S. Kulkarni & Co. on WhatsApp','wa'); break;
    case 'bulk': { const items=staffItems(); S.sheet={kind:'bulk',items,title:t('payStaff'),note:'Salaries and wages are tagged automatically. Slips go on WhatsApp.'}; render(); break; }
    case 'bulkpay': { const it=S.sheet.items; it.forEach(x=>{ const s=sup(x.sid); D.pays.push({id:'p'+Date.now()+x.sid,sid:x.sid,amount:x.amount,mode:'UPI',status:'SUCCESS',utr:utr(),cat:s.cat,ts:Date.now(),inv:'',bill:false}); if(x.dueId){const d=D.dues.find(y=>y.id===x.dueId); if(d) d.paid=true;} else D.dues.filter(d=>d.sid===x.sid&&d.src==='fixed').forEach(d=>d.paid=true); });
      D.score=Math.min(900,D.score+it.length*2); save(); const tot=it.reduce((a,x)=>a+x.amount,0); S.sheet=null; render(); toast(`Paid ${it.length} · ${inr(tot)}. Proof sent on WhatsApp.`); soundbox(`${it.length} payments, ${inr(tot)} bhej diye`,`${it.length} पेमेंट, ${tot} रुपये भेज दिए`); break; }
    case 'snap': S.sheet={kind:'snap'}; render(); break;
    case 'savesnap': { const s=sup(el.dataset.s); const inv='SN-'+(1000+D.bills.length*17); const id='b'+Date.now(); D.bills.push({id,sid:s.id,inv,amount:s.usual,due:dOff(s.credit||5),disc:0,discBy:today0,items:[['Items as per bill',inr(s.usual)]],src:'snap',status:'OPEN',ts:Date.now(),gst:'—'}); D.dues.push({id:'d'+Date.now(),sid:s.id,amount:s.usual,due:dOff(s.credit||5),note:inv,src:'snap',disc:0,discBy:today0,bill:id}); save(); S.sheet=null; render(); toast(`Bill ${inv} saved. Due ${fmtDate(dOff(s.credit||5))} added.`); break; }
    case 'voice': S.sheet={kind:'voice'}; render(); setTimeout(()=>{ if(S.sheet&&S.sheet.kind==='voice'&&!S.sheet.heard){ const s=freqSuppliers()[0]; const amt=lastPay(s.id)?.amount||s.usual; S.sheet.heard=`${short(s.name)} ko ${amt.toLocaleString('en-IN')} bhejo`; S.sheet.match={sid:s.id,amount:amt}; render(); } },1800); break;
    case 'vparse': { const txt=S.sheet.vtext||''; S.sheet.heard=txt; S.sheet.match=parseVoice(txt); render(); break; }
    case 'vpay': { const m=S.sheet.match; openPay(m.sid,m.amount,{from:'voice'}); break; }
    case 'cashadd': S.sheet={kind:'cashadd',dir:'out'}; render(); break;
    case 'cdir': S.sheet.dir=el.dataset.v; render(); break;
    case 'savecash': { const amt=Number(String(S.sheet.amount||'').replace(/\D/g,'')); if(!amt){ toast('Enter an amount','alert'); return; } D.cash.push({id:'k'+Date.now(),dir:S.sheet.dir,amount:amt,what:S.sheet.what||(S.sheet.dir==='in'?'Cash received':'Cash paid'),ts:Date.now()}); save(); S.sheet=null; render(); toast('Cash entry saved to your book'); break; }
    case 'adddue': S.sheet={kind:'adddue',sid:D.sup[0].id,off:'7'}; render(); break;
    case 'savedue': { const amt=Number(String(S.sheet.amount||'').replace(/\D/g,'')); if(!amt){ toast('Enter an amount','alert'); return; } D.dues.push({id:'d'+Date.now(),sid:S.sheet.sid,amount:amt,due:dOff(+S.sheet.off),note:'Added by you',src:'manual',disc:0,discBy:today0}); save(); S.sheet=null; render(); toast('Due saved. Reminder set.','cal'); break; }
    case 'newret': S.sheet={kind:'newret',sid:D.sup.find(s=>!['Staff','Rent','Electricity','Wages'].includes(s.cat)).id}; render(); break;
    case 'saveret': { const amt=Number(String(S.sheet.amount||'').replace(/\D/g,'')); D.returns.unshift({id:'r'+Date.now(),sid:S.sheet.sid,what:S.sheet.what||'Return',amount:amt||0,st:'Sent – awaiting supplier'}); save(); S.sheet=null; render(); toast('Claim sent to supplier on WhatsApp with photo'); break; }
    case 'remind': { const u=D.udhar.find(x=>x.id===el.dataset.u); toast(`Payment link for ${inr(u.amount)} sent to ${u.name}`,'wa'); break; }
    case 'remindall': toast(`Payment links sent to ${D.udhar.length} customers`,'wa'); break;
    case 'dday': { const v=+el.dataset.v; S.dueDay=S.dueDay===v?null:v; render(); break; }
    case 'hear': { const d=openDues().find(x=>x.due>=today0&&x.due<today0+DAY)||openDues()[0]; if(d){ const nm=short(sup(d.sid).name); soundbox(`Aaj ${nm} ka ${inr(d.amount)} due hai`,`आज ${nm} का ${d.amount} रुपये ड्यू है`);} break; }
    case 'toast': toast(el.dataset.m); break;
    case 'tg': S[el.dataset.k]=!S[el.dataset.k]; save(); render(); break;
    case 'outcome': S.outcome=el.dataset.v; save(); render(); toast('Next payment will '+({success:'succeed',pending:'get stuck',failed:'fail'})[el.dataset.v]); break;
    case 'reset': try{localStorage.removeItem(STORE+'-data-'+S.persona)}catch(e){} D=seedFor(S.persona); D.v=3; S.setup=null; save(); render(); toast('Demo data reset for this business'); break;
    case 'cadd': { if(!S.setup) S.setup={added:[],start:Date.now()}; const c=candidates()[+el.dataset.i]; let ex=D.sup.find(s=>s.vpa===c.vpa); if(!ex){ ex={id:S.persona+'n'+Date.now(),name:c.name,vpa:c.vpa,vpaName:c.vpaName,cat:c.cat,usual:c.usual,freq:'Weekly',credit:0,qr:c.qr,p2m:true,verified:true,proof:true,cn:0}; D.sup.push(ex);} if(!S.setup.added.includes(ex.id)) S.setup.added.push(ex.id); save(); render(); if(S.setup.added.length===5) toast('5 suppliers saved – setup complete!'); break; }

function scoreParts(){
  const mine=D.agr.filter(a=>a.cust==='me'); const late=mine.filter(isLate).length, closed=mine.filter(a=>a.status==='closed').length;
  const s1=clamp(92-late*14+closed*2,25,98);

  const inn=D.col.reduce((a,x)=>a+x.amount,0), out=Math.max(1,monthAll()); const s3=clamp(Math.round(50+(inn/out-0.9)*55),25,95);

    ['Steady daily business',25,s2,'From your daily Soundbox and QR collections over 12 months.','chart'],
    ['Money in vs money out',20,s3,inn>=out?'More comes in than goes out – healthy.':'Outgoing is higher than collections this month.','swap'],
    ['Supplier relationships',10,s4,`${rel} regular suppliers, ${acc} credit agreements accepted.`,'users'],
    ['Clean records',10,s5,'Share of credit purchases with a bill attached.','file'],

const num = v => Number(String(v||'').replace(/[^0-9]/g,''))||0;
function newAgr(o){ const n=D.agr.length; const a=Object.assign({id:D.pk+'a'+Date.now()+n,paid:0,intPaid:0,disc:0,discBy:0,parts:true,status:'proposed',channel:'paytm',waived:false,req:null,msme:false,log:[],created:Date.now(),freeUntil:0},o); D.agr.push(a); return a; }
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act; const A=()=>agr(el.dataset.a);
  switch(a){
    case 'set': if(el.dataset.k==='role'){ S.route='home'; S.sheet=null; S.chat=null; S._scroll=0; save(); render(); } break;
    case 'tosup': S.role='supplier'; S.route='home'; save(); render(); break;
    case 'toshop': S.role='shop'; S.route='home'; save(); render(); break;
    case 'back3': S.route = S.route==='chat' ? (S.role==='supplier'?'customers':'khata') : S.route==='supplier'?'pay' : S.role==='supplier' ? 'svmore' : (S.route==='notifs'?'home':'more'); S._scroll=0; render(); break;
    case 'chat': openChat(el.dataset.s,'me'); break;
    case 'svchat': openChat(D.cid, el.dataset.c); break;
    case 'agraccept': { const x=A(); acceptAgr(x); save(); toast(`Accepted. Interest-free till ${fmtDate(x.freeUntil)}${x.rate?`, then ${x.rate}%/month`:''}.`,'check'); if(S.route!=='chat') openChat(x.sid,'me'); else render(); break; }
    case 'agrdecline': { const x=A(); x.status='declined'; x.log.push({ts:Date.now(),by:'buyer',type:'declined'}); save(); render(); break; }
    case 'agrextend': S.sheet={kind:'agrextend',a:el.dataset.a,days:7,why:''}; render(); break;
    case 'extsend': { const x=agr(S.sheet.a); x.req={days:+S.sheet.days,ts:Date.now()}; x.log.push({ts:Date.now(),by:'buyer',type:'extend-req',days:+S.sheet.days,why:S.sheet.why}); S.sheet=null; save(); render();
      if(x.sid!==D.cid){ setTimeout(()=>{ x.freeUntil=Math.max(x.freeUntil,today0)+x.req.days*DAY; x.log.push({ts:Date.now(),by:'sup',type:'extend-ok',days:x.req.days,until:x.freeUntil}); const d=D.dues.find(y=>y.agrId===x.id); if(d) d.due=x.freeUntil; x.req=null; save(); render(); toast(`${short(sup(x.sid).name)} agreed${x.channel==='whatsapp'?' via the WhatsApp link':''}`,'check'); },1800); }
      else toast('Request sent. Switch to Supplier view to respond as '+short(sup(x.sid).name),'clock'); break; }
    case 'extok': { const x=A(); x.freeUntil=Math.max(x.freeUntil,today0)+x.req.days*DAY; x.log.push({ts:Date.now(),by:'sup',type:'extend-ok',days:x.req.days,until:x.freeUntil}); const d=D.dues.find(y=>y.agrId===x.id); if(d) d.due=x.freeUntil; x.req=null; save(); render(); toast('Extension given – new date '+fmtDate(x.freeUntil)); break; }
    case 'extno': { const x=A(); x.log.push({ts:Date.now(),by:'sup',type:'extend-no'}); x.req=null; save(); render(); break; }
    case 'agrwaive': { const x=A(); x.waived=true; x.log.push({ts:Date.now(),by:'sup',type:'waived'}); save(); render(); toast('Interest waived – customer is notified'); break; }
    case 'agrremind': { const x=A(); x.log.push({ts:Date.now(),by:'sup',type:'reminder'}); if(x.cust==='me') D.notifs.unshift({t:`${short(sup(x.sid).name)}: reminder for ${x.inv} – ${inr(owed(x))}`,ts:Date.now(),ic:'bell'}); save(); render();
      toast(x.cust==='me'||x.channel==='paytm'?'Reminder sent on Paytm chat – their Soundbox reads it out at 7 am':'Reminder sent on WhatsApp with the payment link','bell'); break; }
    case 'payagr': payAgr(A()); break;
    case 'svrecv': S.sheet={kind:'svrecv',a:el.dataset.a,mode:'Cash'}; render(); break;
    case 'recvsave': { const x=agr(S.sheet.a); const amt=num(S.sheet.amt)||owed(x); applyPay(x,amt,{mode:S.sheet.mode,rec:1}); S.sheet=null; save(); render(); toast(`${inr(amt)} recorded – khata updated for both sides`); break; }
    case 'svnew': { const c=el.dataset.c&&el.dataset.c!=='undefined'?el.dataset.c:(S.chat&&S.role==='supplier'?S.chat.cust:'me'); S.sheet={kind:'svnew',cust:c,amt:'',what:'',inv:'INV-'+(3400+D.agr.length),freeDays:15,rate:1.5,disc:0,parts:true}; render(); break; }
    case 'svsend': { const o=S.sheet; const amt=num(o.amt); if(!amt){ toast('Enter the bill amount','alert'); return; } const c=custObj(o.cust);
      const x=newAgr({sid:D.cid,cust:o.cust,inv:o.inv||('INV-'+(3400+D.agr.length)),what:o.what||'Goods on credit',amount:amt,freeDays:+o.freeDays,rate:+o.rate,disc:+o.disc,parts:!!o.parts,channel:c.paytm?'paytm':'whatsapp',msme:CC().msme});
      x.log.push({ts:Date.now(),by:'sup',type:'new'}); if(o.cust==='me') D.notifs.unshift({t:`${short(sup(D.cid).name)} sent a credit bill: ${inr(amt)}`,ts:Date.now(),ic:'hand'}); S.sheet=null; save();
      toast(c.paytm?`Sent to ${short(c.name)} on Paytm`:`WhatsApp link sent to ${short(c.name)}`,c.paytm?'paper':'wa'); openChat(D.cid,o.cust);
      if(o.cust!=='me'&&!c.paytm) setTimeout(()=>{ if(x.status==='proposed'){ acceptAgr(x); x.log[x.log.length-1].ts=Date.now(); save(); if(S.route==='chat') render(); toast(`${short(c.name)} accepted via the WhatsApp link (OTP)`,'check'); } },3500);
      if(o.cust==='me') setTimeout(()=>toast('Switch to Shop view to accept it as '+PC().owner.split(' ')[0],'swap'),1800); break; }
    case 'reccredit': { const sid=el.dataset.s||(S.chat&&S.role!=='supplier'?S.chat.sid:null)||D.sup.find(s=>s.credit>0).id; S.sheet={kind:'reccredit',sid,amt:'',what:'',freeDays:7,rate:0}; render(); break; }
    case 'recsave': { const o=S.sheet; const amt=num(o.amt); if(!amt){ toast('Enter an amount','alert'); return; } const s=sup(o.sid); const ch=(s.id===D.cid||s.qr==='paytm')?'paytm':'whatsapp';
      const x=newAgr({sid:s.id,cust:'me',inv:'REC-'+(100+D.agr.length),what:o.what||'Goods on credit',amount:amt,freeDays:+o.freeDays,rate:+o.rate,created:Date.now(),channel:ch,status:'proposed'});
      x.log.push({ts:Date.now(),by:'buyer',type:'new'}); S.sheet=null; save(); openChat(s.id,'me');
      setTimeout(()=>{ acceptAgr(x); x.log[x.log.length-1]={ts:Date.now(),by:'sup',type:'confirmed'}; save(); render(); toast(`${short(s.name)} confirmed${ch==='whatsapp'?' via the WhatsApp link':''} – added to Dues`,'check'); },2000); break; }
    case 'promise': { const sid=el.dataset.s||S.chat.sid; S.sheet={kind:'promise',sid,days:3}; render(); break; }
    case 'promsave': { const o=S.sheet; const x=D.agr.filter(y=>y.sid===o.sid&&y.cust==='me'&&y.status==='active').sort((p,q)=>p.freeUntil-q.freeUntil)[0]; if(!x){ toast('No open bill with this supplier','alert'); S.sheet=null; render(); return; }
      x.log.push({ts:Date.now(),by:'buyer',type:'promise',amt:num(o.amt)||owed(x),on:dOff(+o.days)}); D.dues.push({id:'d'+Date.now(),sid:o.sid,amount:num(o.amt)||owed(x),due:dOff(+o.days),note:'Promised payment · '+x.inv,src:'manual',disc:0,discBy:0}); S.sheet=null; save(); render(); toast('Promise sent – reminder set for both of you','check'); break; }
    case 'qmsg': { const k=S.role==='supplier'?pairKey(D.cid,S.chat.cust):pairKey(S.chat.sid,'me'); D.msgs.push({k,ts:Date.now(),by:S.role==='supplier'?'sup':'buyer',txt:el.dataset.v}); save(); openChat(S.chat.sid,S.chat.cust); break; }
    case 'csend': { const v=(document.getElementById('cin')||{}).value; if(!v||!v.trim()) return; const k=pairKey(S.chat.sid,S.chat.cust); D.msgs.push({k,ts:Date.now(),by:S.role==='supplier'?'sup':'buyer',txt:v.trim()}); save(); openChat(S.chat.sid,S.chat.cust); break; }
    case 'khatahow': S.sheet={kind:'khatahow'}; render(); break;
    case 'sset': S.sheet[el.dataset.k]=isNaN(+el.dataset.v)?el.dataset.v:+el.dataset.v; render(); break;
    case 'sflip': S.sheet[el.dataset.k]=!S.sheet[el.dataset.k]; render(); break;
    case 'consent': D.consent=!D.consent; save(); render(); toast(D.consent?'Consent given for 30 days – you can revoke any time':'Sharing turned off','shield'); break;
    case 'apply': S.sheet={kind:'apply',v:el.dataset.v}; render(); break;
    case 'applysend': D.applied.push({v:S.sheet.v,ts:Date.now()}); S.sheet=null; save(); render(); toast('Application sent to Partner NBFC – decision in about 10 minutes','bolt'); break;
    case 'chqadd': S.sheet={kind:'chqadd',sid:D.sup[2].id,days:7}; render(); break;
    case 'chqsave': { const o=S.sheet; const amt=num(o.amt); if(!amt){ toast('Enter an amount','alert'); return; } D.cheques.push({id:'q'+Date.now(),sid:o.sid,amount:amt,no:o.no||String(4513+D.cheques.length).padStart(6,'0'),date:dOff(+o.days),status:'Issued'}); S.sheet=null; save(); render(); toast('Cheque logged – added to your 14-day forecast','cheque'); break; }
    case 'chqclear': { const q=D.cheques.find(x=>x.id===el.dataset.q); q.status='Cleared'; q.date=Date.now(); const s=sup(q.sid); D.pays.push({id:'p'+Date.now(),sid:q.sid,amount:q.amount,mode:'Cheque',status:'SUCCESS',utr:'',cat:s.cat,ts:Date.now(),inv:'',bill:false,ext:true,via:'Cheque',chq:q.no}); save(); render(); toast('Cheque cleared – added to your book'); break; }
    case 'retag': S.sheet={kind:'retag',p:el.dataset.p,always:false}; render(); break;
    case 'retagsave': { const p=D.pays.find(x=>x.id===S.sheet.p); const c=S.sheet.cat||p.cat; p.cat=c; if(S.sheet.always){ const s=sup(p.sid); s.cat=c; D.pays.filter(x=>x.sid===s.id).forEach(x=>x.cat=c); } S.sheet=null; save(); render(); toast(`Tagged as ${c}`,'tag'); break; }
  }
});

ROOTS3.shop=['home','khata','dues','book','more'];
function mHead(){
  const sv=S.role==='supplier'; const root=ROOTS3[S.role].includes(S.route);
  const nm = sv? sup(D.cid).name : PC().shop, sub = sv? CC().kind : PC().area;
  const menuR = sv?'svmore':'more', inMenu = S.route===menuR;
  return `<div class="m-head">
    ${root?`<button class="icon-btn menu-btn ${inMenu?'on':''}" data-act="go" data-r="${inMenu?'home':menuR}" aria-label="${inMenu?'Close menu':'All features'}">${ic(inMenu?'x':'menu')}</button>`
          :`<button class="icon-btn" data-act="back3" aria-label="Back">${ic('back')}</button>`}
    <div class="shop"><b>${root&&!inMenu?esc(nm):titleFor(S.route)}</b><small>${root&&!inMenu?esc(sub):esc(nm)}</small></div>
    <button class="icon-btn" data-act="go" data-r="notifs" aria-label="${t('notifications')}">${ic('bell')}<span class="dot"></span></button>
  </div>`;
}

/* ---- desktop: shorter sidebar, the rest lives in "More" ---- */
function desktopShell(){
  const sv=S.role==='supplier';
  const items = sv ? [['home','home'],['customers','users'],['svinsights','chart'],['svcredit','bolt'],['svmore','menu']]
    : [['home','home'],['khata','hand'],['pay','send'],['dues','cal'],['book','book'],['insights','chart'],['credit','gauge'],['more','menu']];
  const cur = sv ? ({chat:'customers',settings:'svmore',help:'svmore',persona:'svmore',notifs:'home'}[S.route]||S.route)
                 : ({supplier:'pay',chat:'khata',notifs:'home',perks:'credit'}[S.route]|| (['home','khata','pay','dues','book','insights','credit'].includes(S.route)?S.route:'more'));
  const welcomed = sv || S.welcomed[S.persona];
  const card = sv ? `<button class="shopcard" data-act="pick" style="text-align:left" title="Change business type"><span class="pic" style="${avStyle(D.cid)};width:40px;height:40px;font-weight:800">${initials(sup(D.cid).name)}</span><div><b>${esc(sup(D.cid).name)}</b><small>Supplier view</small></div></button>`
    : `<button class="shopcard" data-act="pick" style="text-align:left" title="Change business type">${pIcon(S.persona,40)}<div><b>${PC().shop}</b><small>${PC().label.split(/ [\/&]/)[0]}</small></div></button>`;
  const count = sv ? svAgr().filter(a=>a.cust!=='me'&&(isLate(a)||a.req)).length : D.agr.filter(a=>a.cust==='me'&&a.status==='proposed').length;
  const lbl = r => r==='svmore'?t('more'):t(r);
  return `<aside class="side" aria-label="Main">${card}
      ${items.map(([r,i])=>`<button class="navbtn" data-act="go" data-r="${r}" aria-current="${cur===r?'page':'false'}">${ic(i)}${lbl(r)}${r==='dues'?`<span class="pill p-due" style="margin-left:auto">${openDues().filter(d=>d.due<=dOff(1)).length}</span>`:''}${(r==='khata'||r==='customers')&&count?`<span class="pill p-over" style="margin-left:auto">${count}</span>`:''}</button>`).join('')}
      ${sv?`<button class="btn block scanbtn" data-act="svnew" style="margin-top:auto">${ic('plus')}New credit</button>`:`<button class="btn block scanbtn" data-act="scan" style="margin-top:auto">${ic('scan')}${t('scan')}</button>`}
    </aside>
    <main class="d-main" id="main">${welcomed? screen() : `<div style="max-width:480px;margin:30px auto" class="card">${welcome()}</div>`}</main>
    ${sheetHtml()}`;
}

/* ---- home: requests · galla (with khata line) · due now · focus · pay again ---- */
function homeScreen(){
  const p=PC(); const w=week(), mx=Math.max(...w.map(x=>Math.max(x.in,x.out)),1);
  const tIn=todayIn(), tOut=todayOut();
  const mine=D.agr.filter(a=>a.cust==='me'); const act=mine.filter(a=>a.status==='active');
  const owe=act.reduce((x,a)=>x+agrOut(a),0), int=act.reduce((x,a)=>x+agrInt(a),0);
  const req=mine.filter(a=>a.status==='proposed').map(a=>{ const s=sup(a.sid); return `<section class="card req-card"><div class="tiny muted" style="font-weight:700">New credit bill</div>
    <b style="display:block;line-height:1.3;margin:2px 0">${esc(s.name)} · ${inr(a.amount)}</b><div class="small muted">${termsLine(a)}</div>
    <div class="row wrap" style="gap:8px;margin-top:10px"><button class="btn" style="min-height:40px;padding:0 14px" data-act="agraccept" data-a="${a.id}">${ic('check')}Accept</button><button class="btn sec" style="min-height:40px;padding:0 14px" data-act="chat" data-s="${a.sid}">Open chat</button></div></section>`; }).join('');
  const galla=`<section class="card hero"><div class="row between" style="position:relative;z-index:1"><b style="font-size:16px">${t('galla')}</b><span class="tiny muted">${fmtDate(Date.now(),{weekday:'short',day:'numeric',month:'short'})}</span></div>
    <div class="galla num"><div><div class="k muted">${ic('down','in-c')}${t('in')}</div><div class="v">${inr(tIn)}</div></div><div><div class="k muted">${ic('up','out-c')}${t('out')}</div><div class="v">${inr(tOut)}</div></div></div>
    <button class="netline hero-link" data-act="go" data-r="khata"><span><span class="tiny muted">Supplier khata · you owe</span><b class="num" style="display:block;font-size:19px">${inr(owe)}</b>${int?`<span class="tiny" style="color:#FFB3A8;font-weight:700">+${inr(int)} interest so far</span>`:''}</span>
      <span class="bars" aria-hidden="true">${w.map(x=>`<span class="pair"><i style="height:${Math.max(3,x.in/mx*36)}px"></i><i class="o" style="height:${Math.max(3,x.out/mx*36)}px"></i></span>`).join('')}</span></button></section>`;
  const dueNow=openDues().filter(d=>d.due<=dOff(1));
  const due=dueNow.length?`<section class="card"><h2>${t('dueToday')} <span class="pill p-due">${dueNow.length}</span><button class="more" data-act="go" data-r="dues">All dues</button></h2><div class="list">${dueNow.slice(0,3).map(dueRow).join('')}</div></section>`:'';
  const focus=`<button class="card focus-row" data-act="focus"><span class="fi">${ic(p.focus[0])}</span><span style="flex:1;min-width:0"><span class="tiny muted" style="font-weight:700;display:block">${t('focus')}</span><b style="display:block;line-height:1.3">${p.focus[1]}</b></span>${ic('chev')}</button>`;
  const top=freqSuppliers().slice(0,S.view==='desktop'?8:6);
  const tiles=`<section class="card"><h2>${t('payAgain')}<button class="more" data-act="go" data-r="pay">${t('suppliers')}</button></h2>
    <div class="tiles">${top.map(s=>{const lp=lastPay(s.id);return `<button class="tile" data-act="pay" data-s="${s.id}" data-a="${lp?lp.amount:s.usual}" data-from="again"><div class="avatar" style="${avStyle(s.id)}">${initials(s.name)}</div><b>${esc(s.name)}</b><span class="amt num">${inr(lp?lp.amount:s.usual)}</span></button>`}).join('')}</div>
    <p class="tiny muted" style="margin:10px 2px 0">Shows the last amount paid – you can change it.</p></section>`;
  if(S.view==='desktop') return dTop(`${t('good')}, ${p.owner.split(' ')[0]}`,`${p.shop} · ${p.area}`,`<button class="btn sec" data-act="snap">${ic('camera')}${t('addBill')}</button><button class="btn sec" data-act="export">${ic('file')}${t('exportCA')}</button>`)
     +`<div class="grid-2"><div class="stack">${galla}${tiles}</div><div class="stack">${req}${due}${focus}</div></div>`;
  return `<div class="stack">${req}${galla}${due}${focus}${tiles}</div>`;
}

/* ---- perks: based on value paid through Vyapaar Pay, not on app share ---- */
function monthVP(){ return monthPaytm(); }
function perkMini(){ const m=monthVP(), goal=150000; return `<section class="card"><h2>${ic('gift')}This month</h2><b class="num" style="font-size:22px">${inr(m)}</b> <span class="muted small">paid to suppliers through Vyapaar Pay</span><div class="prog" style="margin:8px 0"><i style="width:${Math.min(100,m/goal*100)}%"></i></div><p class="small muted" style="margin:0">${m>=goal?'Pakka level reached this month.':`${inr(goal-m)} more this month counts towards Pakka.`}</p><button class="btn sec block" style="margin-top:10px" data-act="go" data-r="perks">See all perks</button></section>`; }

/* ---- small screens: More menus with less text ---- */
function moreScreen(){
  const items=[['khata','hand','Supplier khata'],['insights','chart','Dashboard'],['book','book','Vyapaar Book'],['credit','gauge','Score & credit'],['pay','send','All suppliers'],['cash','cheque','Cash & cheques'],['rates','trend','Rate memory'],['returns','ret','Returns & claims'],['udhar','users','Customer udhaar'],['perks','gift','Perks'],['fees','fee','Charges & fees'],['family','heart','Family & staff'],['setup','store','Agent setup'],['help','help','Help'],['settings','gear','Settings'],['persona','swap','Business type']];
  const grid=`<section class="card"><div class="mgrid">${items.map(([r,i,l])=>`<button data-act="go" data-r="${r}">${ic(i)}<b>${l}</b></button>`).join('')}</div></section>`;
  const demo=`<section class="card"><h2>Demo controls</h2><p class="small muted" style="margin-top:0">Choose what the next payment does.</p>
    <div class="chips">${[['success','Succeeds'],['pending','Gets stuck'],['failed','Fails']].map(([v,l])=>`<button class="chip" data-act="outcome" data-v="${v}" aria-pressed="${S.outcome===v}">${l}</button>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:12px"><button class="btn sec" style="flex:1" data-act="reset">${ic('refresh')}Reset data</button><a class="btn sec" style="flex:1;text-decoration:none" href="demo/index.html">${ic('play')}Field demo</a></div></section>`;
  return dTop(t('more'),'All features','')+`<div class="stack">${grid}${demo}</div>`;
}
function svMore(){
  const it=[['customers','users','Customers'],['svinsights','chart','Dashboard'],['svcredit','bolt','Get paid early'],['settings','gear','Settings'],['help','help','Help'],['persona','store','Business type']];
  return dTop(t('more'),'','')+`<div class="stack"><section class="card"><div class="mgrid">${it.map(([r,i,l])=>`<button data-act="go" data-r="${r}">${ic(i)}<b>${l}</b></button>`).join('')}<button data-act="toshop">${ic('swap')}<b>Back to shop view</b></button></div></section></div>`;
}

/* ---- display menu open/close ---- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(el&&el.dataset.act==='disp'){ S.dispOpen=!S.dispOpen; render(); return; }
  if(S.dispOpen && !e.target.closest('.disp-wrap')){ S.dispOpen=false; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&S.dispOpen){ S.dispOpen=false; render(); } });

/* ---- simpler due row: one source line, one status pill ---- */
function dueRow(d){
  const s=sup(d.sid); const a=d.agrId?agr(d.agrId):null;
  const over=d.due<today0, tdy=d.due>=today0&&d.due<today0+DAY; const [si,sl]=SRC[a?'agreement':d.src]||SRC.manual;
  const it=a?agrInt(a):0, amt=a?owed(a):d.amount;
  const pill=d.paid?`<span class="pill p-paid">${ic('check')}Paid</span>`:over?`<span class="pill p-over">${Math.round((today0-d.due)/DAY)}d late${it?` · +${inr(it)}`:''}</span>`:tdy?`<span class="pill p-due">Today</span>`:`<span class="pill p-info">${relDay(d.due)}</span>`;
  return `<div class="li"><div class="avatar" style="${avStyle(s.id)}">${initials(s.name)}</div>
    <div class="body"><b>${esc(s.name)}</b><span class="src">${ic(si)}${sl}</span><div style="margin-top:4px">${pill}</div></div>
    <div class="end"><b class="num">${d.src==='recur'?'~':''}${inr(amt)}</b>${d.paid?'':`<button class="btn" style="min-height:36px;padding:0 14px;margin-top:4px;font-size:14px" data-act="paydue" data-d="${d.id}">${t('payNow')}</button>`}</div></div>`;
}

render();
</script>
